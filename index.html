<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geometric Guitar Body</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
body{display:flex;flex-direction:column}
svg{flex:1;width:100%;min-height:0;display:block;background:#fff}
#guide{fill:none;stroke:#000;stroke-width:1.25;stroke-dasharray:5 7;vector-effect:non-scaling-stroke}
#body{fill:none;stroke:#000;stroke-width:2.25;vector-effect:non-scaling-stroke;stroke-linejoin:round}
button{border:0;border-top:1px solid #000;background:#fff;color:#000;border-radius:0;font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:16px 0 calc(16px + env(safe-area-inset-bottom));width:100%}
</style>
</head>
<body>
<svg viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet">
  <path id="guide" d="M 768.75 340 C 768.75 240 660 150 500 150 C 350 150 268 240 268 340 C 268 440 350 551 500 551 C 660 551 768.75 440 768.75 340 Z"/>
  <path id="body" d="M 268 310 C 285 220 375 150 500 150 C 660 150 768.75 240 768.75 340 C 768.75 440 660 551 500 551 C 375 551 285 460 268 370 L 340 370 L 340 310 Z"/>
</svg>
<button id="regen">再生成</button>
<script>
(()=>{
  const g=document.getElementById('guide');
  const b=document.getElementById('body');
  const N=360,cx=500,cy=340;

  const closedPath=pts=>{
    let d=`M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
    for(let i=1;i<pts.length;i++) d+=` L ${pts[i][0].toFixed(2)} ${pts[i][1].toFixed(2)}`;
    return d+' Z';
  };

  function generate(){
    const a=235+Math.random()*45;
    const bb=195+Math.random()*38;
    const waist=.15+Math.random()*.16;
    const h3=.025+Math.random()*.06;
    const h5=.01+Math.random()*.035;
    const asym=(Math.random()-.5)*.10;
    const phase=(Math.random()-.5)*1.2;
    const pts=[];

    for(let i=0;i<N;i++){
      const t=Math.PI*2*i/N;
      let x=a*Math.cos(t);
      let y=bb*Math.sin(t);
      y*=1-waist*Math.pow(Math.sin(2*t),2);
      x*=1+h3*Math.cos(3*t+phase)+h5*Math.cos(5*t-phase*.5);
      y*=1+.035*Math.cos(2*t)+asym*Math.sin(t);
      pts.push([cx+x,cy+y]);
    }

    g.setAttribute('d',closedPath(pts));

    const minX=Math.min(...pts.map(p=>p[0]));
    const half=24+Math.random()*17;
    const inner=minX+55+Math.random()*36;
    let ti=0,bi=0,td=Infinity,bd=Infinity;

    for(let i=0;i<N;i++){
      if(pts[i][0]<cx){
        const d1=Math.abs(pts[i][1]-(cy-half));
        const d2=Math.abs(pts[i][1]-(cy+half));
        if(d1<td){td=d1;ti=i}
        if(d2<bd){bd=d2;bi=i}
      }
    }

    const out=[pts[ti]];
    let j=(ti+1)%N,guard=0;
    while(j!==bi&&guard++<N+2){out.push(pts[j]);j=(j+1)%N}
    out.push(pts[bi]);
    out.push([inner,cy+half],[inner,cy-half],[pts[ti][0],cy-half]);
    b.setAttribute('d',closedPath(out));
  }

  document.getElementById('regen').addEventListener('click',generate);
})();
</script>
</body>
</html>
