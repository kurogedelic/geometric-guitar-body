<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geometric Guitar Body</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column}
svg{flex:1;width:100%;min-height:0;display:block;background:#fff}
.guide{fill:none;stroke:#000;stroke-width:1;stroke-dasharray:5 7;opacity:.46;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.body{fill:none;stroke:#000;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
button{appearance:none;width:100%;border:0;border-top:1px solid #000;border-radius:0;background:#fff;color:#000;font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:16px 0 calc(16px + env(safe-area-inset-bottom));cursor:pointer}
button:active{background:#f4f4f4}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <g id="guideGroup"></g>
  <path id="body" class="body"></path>
</svg>
<button id="regen">再生成</button>
<script>
(()=>{
  const NS='http://www.w3.org/2000/svg';
  const guideGroup=document.getElementById('guideGroup');
  const body=document.getElementById('body');

  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const q=(v,s=2)=>Math.round(v/s)*s;
  const P=(x,y)=>({x:q(x),y:q(y)});

  function addCircle(c){
    const e=document.createElementNS(NS,'circle');
    e.setAttribute('class','guide');
    e.setAttribute('cx',c.cx);
    e.setAttribute('cy',c.cy);
    e.setAttribute('r',c.r);
    guideGroup.appendChild(e);
  }
  function addLine(a,b){
    const e=document.createElementNS(NS,'line');
    e.setAttribute('class','guide');
    e.setAttribute('x1',a.x); e.setAttribute('y1',a.y);
    e.setAttribute('x2',b.x); e.setAttribute('y2',b.y);
    guideGroup.appendChild(e);
  }
  function addCross(p){
    addLine(P(p.x-5,p.y),P(p.x+5,p.y));
    addLine(P(p.x,p.y-5),P(p.x,p.y+5));
  }
  function pathFromPts(pts){
    if(!pts.length) return '';
    let d=`M ${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++) d+=` L ${pts[i].x} ${pts[i].y}`;
    return d+' Z';
  }
  function circlePoint(c,deg){
    const t=deg*Math.PI/180;
    return P(c.cx + c.r*Math.cos(t), c.cy + c.r*Math.sin(t));
  }
  function verticalCirclePoint(c, y, side=1){
    const dy=y-c.cy;
    const dx=Math.sqrt(Math.max(0,c.r*c.r-dy*dy));
    return P(c.cx+side*dx, y);
  }
  function circleIntersection(c1,c2,preferUpper=false){
    const dx=c2.cx-c1.cx, dy=c2.cy-c1.cy;
    const d=Math.hypot(dx,dy);
    if(!d) return P(c1.cx,c1.cy);
    const a=(c1.r*c1.r-c2.r*c2.r+d*d)/(2*d);
    const h=Math.sqrt(Math.max(0,c1.r*c1.r-a*a));
    const xm=c1.cx+a*dx/d;
    const ym=c1.cy+a*dy/d;
    const rx=-dy*(h/d), ry=dx*(h/d);
    const p1=P(xm+rx,ym+ry), p2=P(xm-rx,ym-ry);
    return preferUpper ? (p1.y<p2.y?p1:p2) : (p1.y>p2.y?p1:p2);
  }
  function angle(c,p){ return Math.atan2(p.y-c.cy,p.x-c.cx); }
  function sampleArc(c,p0,p1,dir='cw',steps=18){
    let a0=angle(c,p0), a1=angle(c,p1);
    const TAU=Math.PI*2;
    if(dir==='cw'){
      while(a1<a0) a1+=TAU;
    }else{
      while(a1>a0) a1-=TAU;
    }
    const pts=[];
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      const a=a0+(a1-a0)*t;
      pts.push(P(c.cx+c.r*Math.cos(a), c.cy+c.r*Math.sin(a)));
    }
    return pts;
  }
  function combine(){
    const out=[];
    for(let i=0;i<arguments.length;i++){
      const seg=arguments[i];
      for(let j=0;j<seg.length;j++){
        if(out.length && out[out.length-1].x===seg[j].x && out[out.length-1].y===seg[j].y) continue;
        out.push(seg[j]);
      }
    }
    return out;
  }

  function makePreset(){
    const cy=340;
    const family=pick(['strand','vader','klein','q']);
    const tailX=pick([178,188,198,208,218]);
    const notchHalf=pick([28,32,36]);
    const notchDepth=pick([60,72,84,96]);

    let rear, upper, lower, hornU, hornL, tail;
    if(family==='strand'){
      rear ={cx:328, cy:340, r:192};
      upper={cx:536, cy:220, r:164};
      lower={cx:548, cy:456, r:174};
      hornU={cx:752, cy:246, r:92};
      hornL={cx:746, cy:422, r:84};
      tail ={cx:246, cy:340, r:84};
    }else if(family==='vader'){
      rear ={cx:316, cy:346, r:178};
      upper={cx:514, cy:194, r:178};
      lower={cx:528, cy:486, r:166};
      hornU={cx:784, cy:220, r:110};
      hornL={cx:804, cy:440, r:74};
      tail ={cx:236, cy:340, r:76};
    }else if(family==='klein'){
      rear ={cx:352, cy:350, r:210};
      upper={cx:588, cy:212, r:136};
      lower={cx:564, cy:452, r:178};
      hornU={cx:734, cy:254, r:82};
      hornL={cx:718, cy:420, r:122};
      tail ={cx:258, cy:340, r:96};
    }else{
      rear ={cx:330, cy:340, r:184};
      upper={cx:538, cy:216, r:154};
      lower={cx:538, cy:464, r:164};
      hornU={cx:758, cy:236, r:96};
      hornL={cx:758, cy:444, r:96};
      tail ={cx:242, cy:340, r:82};
    }

    [rear,upper,lower,hornU,hornL,tail].forEach(c=>{
      c.cx=q(c.cx+rnd(-12,12));
      c.cy=q(c.cy+rnd(-12,12));
      c.r=q(c.r+rnd(-10,10));
    });

    return {family,cy,tailX,notchHalf,notchDepth,rear,upper,lower,hornU,hornL,tail};
  }

  function generate(){
    guideGroup.replaceChildren();
    const g=makePreset();
    const {family,cy,tailX,notchHalf,notchDepth,rear,upper,lower,hornU,hornL,tail}=g;

    [rear,upper,lower,hornU,hornL,tail].forEach(addCircle);

    const rearUpper = circleIntersection(rear, upper, true);
    const rearLower = circleIntersection(rear, lower, false);
    const upperValley = circleIntersection(upper, hornU, false);
    const lowerValley = circleIntersection(lower, hornL, true);

    const upperHornPeak = circlePoint(hornU, family==='vader' ? -18 : family==='klein' ? -6 : -28);
    const lowerHornPeak = circlePoint(hornL, family==='vader' ? 20 : family==='klein' ? 34 : 24);

    const rearBackUpper = verticalCirclePoint(rear, cy-notchHalf-18, -1);
    const rearBackLower = verticalCirclePoint(rear, cy+notchHalf+18, -1);

    const tailTop = P(tailX, cy-notchHalf);
    const tailTopInner = P(tailX+notchDepth, cy-notchHalf);
    const tailBottomInner = P(tailX+notchDepth, cy+notchHalf);
    const tailBottom = P(tailX, cy+notchHalf);

    [rearUpper,rearLower,upperValley,lowerValley,upperHornPeak,lowerHornPeak,rearBackUpper,rearBackLower].forEach(addCross);
    [tailTop,tailTopInner,tailBottomInner,tailBottom].forEach(addCross);
    addLine(tailTop,tailTopInner);
    addLine(tailTopInner,tailBottomInner);
    addLine(tailBottomInner,tailBottom);
    addLine(tailBottom,rearBackLower);
    addLine(rearBackUpper,tailTop);
    addLine(lowerHornPeak,upperHornPeak);

    const seg1=[tailTop,tailTopInner,tailBottomInner,tailBottom,rearBackLower];
    const seg2=sampleArc(rear,rearBackLower,rearLower,'cw',10);
    const seg3=sampleArc(lower,rearLower,lowerValley,'ccw',14);
    const seg4=sampleArc(hornL,lowerValley,lowerHornPeak,'cw',12);
    const seg5=[upperHornPeak];
    const seg6=sampleArc(hornU,upperHornPeak,upperValley,'cw',12);
    const seg7=sampleArc(upper,upperValley,rearUpper,'ccw',14);
    const seg8=sampleArc(rear,rearUpper,rearBackUpper,'ccw',10);
    const seg9=[tailTop];

    const pts=combine(seg1,seg2,seg3,seg4,seg5,seg6,seg7,seg8,seg9);
    body.setAttribute('d',pathFromPts(pts));
  }

  document.getElementById('regen').addEventListener('click',generate);
  generate();
})();
</script>
</body>
</html>
